    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  religion:
    collection: religions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
