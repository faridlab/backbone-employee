server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/employee.log
module:
  name: employee
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  bank:
    collection: banks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  data_consent:
    collection: data_consents
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  data_subject_request:
    collection: data_subject_requests
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee:
    collection: employees
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_bank_account:
    collection: employee_bank_accounts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_bpjs:
    collection: employee_bpjs
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_certification:
    collection: employee_certifications
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_contact:
    collection: employee_contacts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_education:
    collection: employee_educations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_family:
    collection: employee_families
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_identity:
    collection: employee_identities
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_tax:
    collection: employee_taxes
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_work_experience:
    collection: employee_work_experiences
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employment:
    collection: employments
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employment_history:
    collection: employment_histories
